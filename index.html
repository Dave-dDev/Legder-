<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="A minimal, local-first clothing line ledger: buy items, record sales, and watch the profit. Everything stays in this browser."
    />
    <title>Clothing Ledger</title>
    <link rel="icon" href="data:," />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page">
      <header class="masthead">
        <div class="masthead__text">
          <p class="eyebrow">Local-first</p>
          <h1>Clothing Ledger</h1>
          <p class="lede">
            Track what you pay, what it sells for, and what the line earns.
          </p>
        </div>
        <button id="export-button" class="button button--ghost" type="button">
          Export CSV
        </button>
      </header>

      <main id="main">
        <div class="layout">
          <section class="panel panel--form" aria-labelledby="add-heading">
            <h2 id="add-heading" class="panel__title">Add an item</h2>

            <form id="clothing-form" class="form" novalidate>
              <div class="field">
                <label for="date">Purchase date</label>
                <input
                  id="date"
                  name="date"
                  type="date"
                  required
                  autocomplete="off"
                  aria-describedby="date-error"
                />
                <p class="field__error" id="date-error" role="alert"></p>
              </div>

              <div class="field">
                <label for="item">Item</label>
                <input
                  id="item"
                  name="item"
                  type="text"
                  maxlength="120"
                  placeholder="e.g. Vintage denim jacket"
                  required
                  autocomplete="off"
                  aria-describedby="item-error"
                />
                <p class="field__error" id="item-error" role="alert"></p>
              </div>

              <div class="field">
                <label for="purchase">Purchase price</label>
                <input
                  id="purchase"
                  name="purchase"
                  type="text"
                  inputmode="decimal"
                  placeholder="0.00"
                  required
                  autocomplete="off"
                  aria-describedby="purchase-error"
                />
                <p class="field__error" id="purchase-error" role="alert"></p>
              </div>

              <div class="field">
                <label for="sale">Sale price</label>
                <input
                  id="sale"
                  name="sale"
                  type="text"
                  inputmode="decimal"
                  placeholder="0.00"
                  autocomplete="off"
                  aria-describedby="sale-error sale-hint"
                />
                <p class="field__hint" id="sale-hint">Leave blank while the item is in stock.</p>
                <p class="field__error" id="sale-error" role="alert"></p>
              </div>

              <button class="button button--primary" type="submit">Add item</button>
            </form>
          </section>

          <section class="panel panel--dashboard" aria-labelledby="dashboard-heading">
            <h2 id="dashboard-heading" class="panel__title">Dashboard</h2>

            <div id="summary" class="summary"></div>

            <div class="charts">
              <figure class="chart">
                <figcaption class="chart__title">Profit by item</figcaption>
                <div id="profit-chart" class="chart__body"></div>
              </figure>

              <figure class="chart">
                <figcaption class="chart__title">Monthly activity</figcaption>
                <div id="monthly-chart" class="chart__body"></div>
              </figure>
            </div>
          </section>
        </div>

        <section class="panel panel--records" aria-labelledby="records-heading">
          <div class="panel__head">
            <h2 id="records-heading" class="panel__title">Items</h2>
            <p class="panel__meta" id="records-count"></p>
          </div>
          <div id="records"></div>
        </section>
      </main>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

  </body>
</html>
